<style>
        /* ==========================================================================
           1. Basis & Variabelen
           ========================================================================== */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border-light: rgba(255, 255, 255, 0.5);
            --glass-border-dark: rgba(0, 0, 0, 0.2);
            --glass-glow: rgba(255, 255, 255, 0.1);
            
            --text-main: #ffffff;
            --text-muted: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ==========================================================================
           2. Full-Screen Achtergrond
           ========================================================================== */
        #background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: url('https://huisvisual.x02.me/i/HKTT.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.75) 50%, rgba(0,0,0,0.9) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* ==========================================================================
           3. Liquid Glass Utility
           ========================================================================== */
        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            border: 1px solid transparent;
            border-top-color: var(--glass-border-light);
            border-left-color: var(--glass-border-light);
            border-bottom-color: var(--glass-border-dark);
            border-right-color: var(--glass-border-dark);
            
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.2),
                inset 0 1px 1px rgba(255, 255, 255, 0.5),
                inset 0 -1px 1px rgba(0, 0, 0, 0.2),
                0 0 30px var(--glass-glow);
                
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* ==========================================================================
           4. Navigatiebalk (Desktop)
           ========================================================================== */
        .navbar-wrapper {
            position: fixed;
            top: 24px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1000;
            padding: 0 24px;
        }

        .liquid-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            padding: 16px 32px;
            border-radius: 100px;
            color: #ffffff;
        }

        .desktop-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .nav-left, .nav-right {
            flex: 1;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .nav-right {
            text-align: right;
            font-weight: 500;
            opacity: 0.9;
        }

        .nav-center {
            display: flex;
            gap: 40px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .liquid-nav a {
            transition: all 0.3s ease;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .liquid-nav a:hover {
            color: #d1d5db;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .nav-left a:hover {
            color: #fff;
            opacity: 0.8;
        }

        .nav-active {
            opacity: 1 !important;
        }

        .mobile-nav {
            display: none;
        }

        /* ==========================================================================
           5. Split-Screen Layout (Desktop)
           ========================================================================== */
        .split-layout {
            display: flex;
            flex: 1;
            width: 100%;
            padding-top: 100px; /* Ruimte voor de navigatie */
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .text-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            width: 50%;
        }

        .image-section {
            flex: 1;
            width: 50%;
            position: relative;
        }

        .image-section img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-top-left-radius: 24px;
            border-bottom-left-radius: 24px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        /* ==========================================================================
           6. Liquid Glass Content Box
           ========================================================================== */
        .glass-content {
            border-radius: 24px;
            padding: 56px 48px;
            max-width: 600px;
            width: 100%;
        }

        .glass-content:hover {
            transform: none;
            background: var(--glass-bg);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.2),
                inset 0 1px 1px rgba(255, 255, 255, 0.5),
                inset 0 -1px 1px rgba(0, 0, 0, 0.2),
                0 0 30px var(--glass-glow);
            border-top-color: var(--glass-border-light);
        }

        .glass-content h2 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 24px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }

        .intro-text {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.7;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        .feature-cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 48px;
        }

        .feature-card {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 24px;
            border-radius: 16px;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .feature-card:hover {
            transform: translateX(8px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .feature-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .feature-text h4 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .feature-text p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .closing-text {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 24px;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .btn-cta {
            display: inline-block;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .btn-cta:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px var(--glass-shadow), 0 0 25px rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        /* ==========================================================================
           7. Footer
           ========================================================================== */
        .site-footer {
            background-color: #ffffff;
            border-top: 1px solid #e5e7eb;
            color: #4b5563;
            padding: 60px 24px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            text-align: center;
            font-size: 0.9rem;
        }

        .footer-col h4 { color: #111827; margin-bottom: 16px; }
        .footer-col ul { list-style: none; }
        .footer-col ul li { margin-bottom: 8px; color: #4b5563; }
        .footer-col a { color: #4b5563; transition: color 0.3s ease; }
        .footer-col a:hover { color: #111827; }

        /* ==========================================================================
           8. Responsive Design (GEOPTIMALISEERD VOOR MOBIEL)
           ========================================================================== */
        @media (max-width: 900px) {
            
            /* Navigatie Mobiel */
            .desktop-nav { display: none; }
            .mobile-nav { 
                display: flex; 
                justify-content: center; 
                width: 100%; 
            }
            .mobile-nav a { 
                display: flex; 
                align-items: center; 
                gap: 8px; 
                font-weight: 600; 
                font-size: 0.95rem; 
            }
            .navbar-wrapper { padding: 0 16px; top: 16px; }
            .liquid-nav { padding: 14px 24px; justify-content: center; }

            /* Layout: Foto sectie verbergen (zit al in de achtergrond!) */
            .split-layout {
                flex-direction: column;
                padding-top: 80px; /* Precies genoeg ruimte voor de nav */
                display: block;
            }

            .image-section {
                display: none; /* Verwijder de dubbele foto voor een strakker resultaat */
            }

            /* Tekst Container & Glass Box */
            .text-section {
                width: 100%;
                padding: 20px 16px 60px; 
            }

            .glass-content {
                padding: 32px 24px; /* Iets compacter voor mobiel */
                border-radius: 20px;
            }

            .glass-content h2 {
                font-size: 2rem; /* Iets kleinere titel */
                margin-bottom: 16px;
            }

            .intro-text {
                font-size: 1rem;
                margin-bottom: 32px;
            }

            /* Feature Cards: Compact & Strak */
            .feature-cards {
                gap: 12px;
                margin-bottom: 32px;
            }

            .feature-card { 
                flex-direction: row; /* Houd iconen NAAST de tekst i.p.v. erboven */
                align-items: flex-start; 
                padding: 16px;
                gap: 16px;
            }

            .feature-icon {
                width: 40px;
                height: 40px;
            }

            .feature-icon svg {
                width: 20px;
                height: 20px;
            }

            .feature-text h4 {
                font-size: 1rem;
            }

            .feature-text p {
                font-size: 0.9rem;
            }

            /* CTA Knop - Volledige breedte op mobiel */
            .btn-cta {
                display: block;
                width: 100%;
                text-align: center;
                padding: 14px 20px;
            }

            /* Footer */
            .site-footer {
                padding: 40px 24px;
            }

            .footer-container { 
                grid-template-columns: 1fr; 
                gap: 32px; 
            }
        }
    </style>
